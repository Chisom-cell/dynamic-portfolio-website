{% extends "basic.html" %} 
{% block title %} Sign-Up {% endblock title %} 
{%block stylecss %}
<link rel="stylesheet" href="https://cloudfare" />
{% endblock stylecss %} {% block body %}

<div class="container mt-4 p-2">
  <div class="row">
    <div class="col-md-4"></div>

    <div class="col-md-4">
    <br>
    <br>
    <br>
    <br>
      <h3 class="text-white bg-dark text-center p-3">Sign Up Here</h3>

      <div class="card p-2" id="myform">
      <form action="" method="post">{% csrf_token %}
        <div class="form-group">
          <h5>
            <span><i class="bi bi-menu-button navicon"></i> Email</span>
          </h5>
          <input type="text" class="form-control mb-3" />
        </div>

        <div class="form-group">
          <h5>
            <span><i class="bi bi-key-fill"></i> Password</span>
          </h5>
          <input type="password" class="form-control mb-3" />
        </div>

        <div class="form-group">
          <h5>
            <span><i class="bi bi-lock-fill"></i> Confirm Password</span>
          </h5>
          <input type="password" class="form-control mb-3" />
        </div>

        <div class="d-grid gap-2">
          <button class="btn btn-dark" type="submit">SignUp</button>
        </div>
      </div>
      </form>
    </div>

    <div class="col-md-4"></div>
  </div>
</div>

{% endblock body %}
